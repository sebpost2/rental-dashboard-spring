services:
  - type: web
    name: rental-dashboard-spring
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # JDBC form from the Neon console: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The Vercel URL of the Java-edition frontend, e.g. https://rental-dashboard-java.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENVIRONMENT
        value: production
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # Render sits behind Cloudflare and appends to a client-supplied X-Forwarded-For, so its
      # rightmost public hop is a Cloudflare edge, not the client. Cloudflare overwrites
      # CF-Connecting-IP with the real client IP, which makes it the one safe rate-limit key here.
      - key: SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER
        value: CF-Connecting-IP
